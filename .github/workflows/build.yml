name: Build Granite Studios

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-mac:
    name: Build macOS .app bundle
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate icon.icns from icon.png
        run: |
          python - <<'PY'
          from PIL import Image

          im = Image.open("icon.png").convert("RGBA")
          im.save("icon.icns", format="ICNS")
          print("icon.icns generated")
          PY

      - name: Build .app with PyInstaller
        run: |
          pyinstaller main.py \
            --name "Granite Studios" \
            --windowed \
            --onedir \
            --noconfirm \
            --clean \
            --icon "icon.icns" \
            --add-data "src:src" \
            --add-data "icon.png:." \
            --add-data "icon.icns:." \
            --hidden-import rawpy \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtGui \
            --hidden-import moviepy \
            --hidden-import onnxruntime \
            --hidden-import pillow_heif \
            --hidden-import cv2 \
            --hidden-import pyshortcuts \
            --hidden-import psutil \
            --hidden-import rembg

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build .dmg installer
        run: |
          mkdir -p dist_dmg
          create-dmg \
            --volname "Granite Studios" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 100 \
            --icon "Granite Studios.app" 180 170 \
            --hide-extension "Granite Studios.app" \
            --app-drop-link 480 170 \
            "dist_dmg/Granite-Studios-macOS.dmg" \
            "dist/Granite Studios.app" || true

      - name: Verify the .dmg was created
        run: test -f "dist_dmg/Granite-Studios-macOS.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Granite-Studios-macOS
          path: dist_dmg/Granite-Studios-macOS.dmg
          if-no-files-found: error
